launch_app:
  target:
    device:
      integration: ha_sidecar
  fields:
    package:
      required: true
      example: io.homeassistant.companion.android
      selector:
        text:
    path:
      example: lovelace/kitchen
      selector:
        text:

bring_to_front:
  target:
    device:
      integration: ha_sidecar
  fields:
    path:
      example: lovelace/kitchen
      selector:
        text:

set_allowlist:
  target:
    device:
      integration: ha_sidecar
  fields:
    packages:
      required: true
      example: '["com.spotify.music"]'
      selector:
        object:

set_alarm:
  target:
    device:
      integration: ha_sidecar
  fields:
    time:
      required: true
      selector:
        time:
    days:
      selector:
        select:
          multiple: true
          options: [mon, tue, wed, thu, fri, sat, sun]
    label:
      selector:
        text:
    alarm_id:
      selector:
        text:
    enabled:
      default: true
      selector:
        boolean:
    snooze_minutes:
      default: 9
      selector:
        number:
          min: 1
          max: 60

cancel_alarm:
  target:
    device:
      integration: ha_sidecar
  fields:
    alarm_id:
      required: true
      selector:
        text:

stop_alarm:
  target:
    device:
      integration: ha_sidecar

snooze_alarm:
  target:
    device:
      integration: ha_sidecar

install_system_update:
  target:
    device:
      integration: ha_sidecar
  fields:
    uri:
      required: true
      example: file:///sdcard/Download/ota.zip
      selector:
        text:

set_alarm_enabled:
  target:
    device:
      integration: ha_sidecar
  fields:
    alarm_id:
      required: true
      selector:
        text:
    enabled:
      required: true
      selector:
        boolean:

skip_next_alarm:
  target:
    device:
      integration: ha_sidecar
  fields:
    alarm_id:
      selector:
        text:

mute_alarms:
  target:
    device:
      integration: ha_sidecar
  fields:
    duration:
      selector:
        duration:

unmute_alarms:
  target:
    device:
      integration: ha_sidecar

start_timer:
  target:
    device:
      integration: ha_sidecar
  fields:
    duration:
      required: true
      selector:
        duration:
    label:
      example: Batch 1
      selector:
        text:
    timer_id:
      selector:
        text:

start_stopwatch:
  target:
    device:
      integration: ha_sidecar
  fields:
    label:
      example: Treadmill
      selector:
        text:
    timer_id:
      selector:
        text:

pause_timer:
  target:
    device:
      integration: ha_sidecar
  fields:
    timer_id:
      selector:
        text:
    label:
      selector:
        text:

resume_timer:
  target:
    device:
      integration: ha_sidecar
  fields:
    timer_id:
      selector:
        text:
    label:
      selector:
        text:

cancel_timer:
  target:
    device:
      integration: ha_sidecar
  fields:
    timer_id:
      selector:
        text:
    label:
      selector:
        text:

adjust_timer:
  target:
    device:
      integration: ha_sidecar
  fields:
    timer_id:
      selector:
        text:
    label:
      selector:
        text:
    seconds:
      required: true
      selector:
        number:
          min: -86400
          max: 86400
          unit_of_measurement: s
