launch_app:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: ha_sidecar
          multiple: true
    package:
      required: true
      example: io.homeassistant.companion.android
      selector:
        text:
    path:
      example: lovelace/kitchen
      selector:
        text:

bring_to_front:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: ha_sidecar
          multiple: true
    path:
      example: lovelace/kitchen
      selector:
        text:

set_allowlist:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: ha_sidecar
          multiple: true
    packages:
      required: true
      example: '["com.spotify.music"]'
      selector:
        object:

set_alarm:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: ha_sidecar
          multiple: true
    time:
      required: true
      selector:
        time:
    days:
      selector:
        select:
          multiple: true
          options: [mon, tue, wed, thu, fri, sat, sun]
    label:
      selector:
        text:
    alarm_id:
      selector:
        text:
    enabled:
      default: true
      selector:
        boolean:
    snooze_minutes:
      default: 9
      selector:
        number:
          min: 1
          max: 60

cancel_alarm:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: ha_sidecar
          multiple: true
    alarm_id:
      required: true
      selector:
        text:

stop_alarm:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: ha_sidecar
          multiple: true

snooze_alarm:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: ha_sidecar
          multiple: true

install_system_update:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: ha_sidecar
          multiple: true
    uri:
      required: true
      example: file:///sdcard/Download/ota.zip
      selector:
        text:

set_alarm_enabled:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: ha_sidecar
          multiple: true
    alarm_id:
      required: true
      selector:
        text:
    enabled:
      required: true
      selector:
        boolean:

skip_next_alarm:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: ha_sidecar
          multiple: true
    alarm_id:
      selector:
        text:

mute_alarms:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: ha_sidecar
          multiple: true
    duration:
      selector:
        duration:

unmute_alarms:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: ha_sidecar
          multiple: true

start_timer:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: ha_sidecar
          multiple: true
    duration:
      required: true
      selector:
        duration:
    label:
      example: Batch 1
      selector:
        text:
    timer_id:
      selector:
        text:

start_stopwatch:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: ha_sidecar
          multiple: true
    label:
      example: Treadmill
      selector:
        text:
    timer_id:
      selector:
        text:

pause_timer:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: ha_sidecar
          multiple: true
    timer_id:
      selector:
        text:
    label:
      selector:
        text:

resume_timer:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: ha_sidecar
          multiple: true
    timer_id:
      selector:
        text:
    label:
      selector:
        text:

cancel_timer:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: ha_sidecar
          multiple: true
    timer_id:
      selector:
        text:
    label:
      selector:
        text:

adjust_timer:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: ha_sidecar
          multiple: true
    timer_id:
      selector:
        text:
    label:
      selector:
        text:
    seconds:
      required: true
      selector:
        number:
          min: -86400
          max: 86400
          unit_of_measurement: s

enter_night_mode:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: ha_sidecar
          multiple: true

exit_night_mode:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: ha_sidecar
          multiple: true
    follow_schedule:
      default: false
      selector:
        boolean:

restart_companion:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: ha_sidecar
          multiple: true

listen:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: ha_sidecar
          multiple: true

cancel_listening:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: ha_sidecar
          multiple: true

show_card:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: ha_sidecar
          multiple: true
    entity_id:
      example: weather.home
      selector:
        entity:
    type:
      selector:
        select:
          options: [weather, media, image, entity]
    title:
      example: Front door
      selector:
        text:
    subtitle:
      selector:
        text:
    value:
      example: 21 °C
      selector:
        text:
    image:
      example: https://example.com/snapshot.jpg
      selector:
        text:
    details:
      selector:
        object:
    duration:
      default: 20
      selector:
        number:
          min: 3
          max: 300
          unit_of_measurement: s
